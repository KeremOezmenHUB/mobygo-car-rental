<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobyGo | Add Vehicle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Moby<span>Go</span></a>
        <ul>
            <li><a href="admin-dashboard.html">&#8592; Dashboard</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>Register New Vehicle</h1>
        <p>Add a new car to the MobyGo fleet</p>
    </div>

    <div class="container">
        <div class="form-wrap">
            <div class="form-card">
                <form id="carForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="licensePlate">License Plate</label>
                            <input type="text" id="licensePlate" name="licensePlate" placeholder="e.g. ZH-100234" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category">
                                <option value="Electric">&#9889; Electric</option>
                                <option value="Hybrid">&#9881; Hybrid</option>
                                <option value="City">&#127749; City</option>
                            </select>
                        </div>
                        <div class="form-group span-2">
                            <label for="model">Model Name</label>
                            <input type="text" id="model" name="model" placeholder="e.g. Tesla Model 3" required>
                        </div>
                        <div class="form-group">
                            <label for="stationId">Station ID</label>
                            <input type="number" id="stationId" name="stationId" placeholder="e.g. 1" min="1" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Save Vehicle</button>
                        <button type="button" onclick="history.back()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <footer>&copy; 2025 <span>MobyGo</span> &mdash; Admin Panel</footer>
    <script src="app.js"></script>
</body>
</html>

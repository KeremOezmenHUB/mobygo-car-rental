<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobyGo Admin | Fleet Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Moby<span>Go</span></a>
        <ul>
            <li><a href="index.html">Fleet</a></li>
            <li><a href="stations.html">Stations</a></li>
            <li><a href="car-form.html">+ Add Car</a></li>
            <li><a href="admin-dashboard.html" class="active">Admin</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>Fleet Management</h1>
        <p>Overview and control of all MobyGo vehicles</p>
    </div>

    <div class="container">
        <div class="stats-grid" id="stats-grid"></div>

        <div class="table-wrap">
            <div class="table-top">
                <h2>All Vehicles</h2>
                <a href="car-form.html" class="btn btn-primary" style="font-size:0.85rem; padding:8px 18px;">+ Add Vehicle</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>License Plate</th>
                        <th>Model</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Station</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Edit Car Modal -->
    <div id="edit-modal" class="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Vehicle</h3>
                <button class="modal-close" onclick="closeEditModal()" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="edit-form">
                    <input type="hidden" id="edit-car-id">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>License Plate</label>
                            <input type="text" id="edit-plate" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="edit-category">
                                <option value="Electric">Electric</option>
                                <option value="Hybrid">Hybrid</option>
                                <option value="City">City</option>
                            </select>
                        </div>
                        <div class="form-group span-2">
                            <label>Model Name</label>
                            <input type="text" id="edit-model" required>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select id="edit-status">
                                <option value="Available">Available</option>
                                <option value="Rented">Rented</option>
                                <option value="Maintenance">Maintenance</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Station ID</label>
                            <input type="number" id="edit-station" min="1" required>
                        </div>
                    </div>
                    <div id="edit-error" class="error-msg" style="display:none"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <footer>&copy; 2025 <span>MobyGo</span> &mdash; Admin Panel</footer>
    <script src="app.js"></script>
</body>
</html>

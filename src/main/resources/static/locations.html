<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Locations – MobyGo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-car-front-fill me-1"></i>Moby<span>Go</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Cars</a></li>
        <li class="nav-item"><a class="nav-link active" href="/locations.html">Locations</a></li>
        <li class="nav-item"><a class="nav-link" href="/rentals.html">My Rentals</a></li>
        <li class="nav-item d-none" id="adminLink"><a class="nav-link" href="/admin.html">Admin</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white-50 small" id="userInfo"></span>
        <button class="btn btn-outline-light btn-sm" id="loginBtn" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        <button class="btn btn-outline-light btn-sm d-none" id="logoutBtn" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="container text-center">
    <h1><i class="bi bi-geo-alt-fill me-2"></i>Our Locations</h1>
    <p>Find MobyGo at airports, train stations, and city centres across Switzerland</p>
  </div>
</section>

<!-- Locations -->
<div class="container py-5">
  <div class="row g-4" id="locationsGrid">
    <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
  </div>
</div>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-lock-fill me-2"></i>Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="loginError" class="alert alert-danger d-none small"></div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="loginUser" class="form-control"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="loginPass" class="form-control"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-mg w-100" onclick="doLogin()">Sign In</button>
      </div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
  updateNavAuth();

  async function init() {
    try {
      const locations = await API.get('/locations');
      renderLocations(locations);
    } catch (e) {
      document.getElementById('locationsGrid').innerHTML =
        `<div class="col-12"><div class="alert alert-danger">Could not load locations: ${e.message}</div></div>`;
    }
  }

  function renderLocations(locations) {
    const grid = document.getElementById('locationsGrid');
    if (!locations.length) {
      grid.innerHTML = '<div class="col-12 text-center text-muted">No locations found</div>';
      return;
    }
    const icons = ['airplane', 'train-front', 'building'];
    grid.innerHTML = locations.map((loc, i) => `
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100 location-card">
          <div class="card-body">
            <div class="d-flex align-items-start gap-3 mb-3">
              <div class="bg-light rounded-3 p-3">
                <i class="bi bi-${icons[i % 3]} location-card .bi"></i>
              </div>
              <div>
                <h5 class="card-title mb-1">${loc.name}</h5>
                <span class="badge bg-primary">${loc.city}</span>
              </div>
            </div>
            <p class="text-muted small mb-3">
              <i class="bi bi-geo-alt me-1"></i>${loc.address}
            </p>
            <a href="/?locationId=${loc.id}" class="btn btn-outline-primary btn-sm">
              <i class="bi bi-car-front me-1"></i>View Available Cars
            </a>
          </div>
        </div>
      </div>`).join('');
  }

  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('d-none');
    try {
      Auth.save(username, password);
      const users = await API.get('/users');
      const me = users.find(u => u.username === username);
      if (me) sessionStorage.setItem('mg_role', me.role);
      bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      updateNavAuth();
      showToast(`Welcome, ${username}!`);
    } catch (e) {
      Auth.clear();
      errEl.textContent = 'Invalid username or password';
      errEl.classList.remove('d-none');
    }
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MobyGo – Car Rental</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="/css/style.css" rel="stylesheet"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-car-front-fill me-1"></i>Moby<span>Go</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="/">Cars</a></li>
        <li class="nav-item"><a class="nav-link" href="/locations.html">Locations</a></li>
        <li class="nav-item"><a class="nav-link" href="/rentals.html">My Rentals</a></li>
        <li class="nav-item d-none" id="adminLink"><a class="nav-link" href="/admin.html">Admin</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span class="text-white-50 small" id="userInfo"></span>
        <button class="btn btn-outline-light btn-sm" id="loginBtn" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
        <button class="btn btn-outline-light btn-sm d-none" id="logoutBtn" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="container text-center">
    <h1><i class="bi bi-car-front-fill me-2"></i>Discover Your Perfect Ride</h1>
    <p class="mb-4">Flexible car rentals across Switzerland — from economy to luxury</p>
    <div class="row justify-content-center g-2">
      <div class="col-auto">
        <select id="filterCategory" class="form-select" onchange="filterCars()">
          <option value="">All Categories</option>
          <option>ECONOMY</option><option>COMPACT</option>
          <option>SUV</option><option>LUXURY</option><option>VAN</option>
        </select>
      </div>
      <div class="col-auto">
        <select id="filterLocation" class="form-select" onchange="filterCars()">
          <option value="">All Locations</option>
        </select>
      </div>
    </div>
  </div>
</section>

<!-- Rates bar -->
<div class="bg-white border-bottom py-2">
  <div class="container">
    <div class="d-flex flex-wrap gap-3 justify-content-center small text-muted" id="ratesBar">
      <span><i class="bi bi-info-circle me-1"></i>Loading rates…</span>
    </div>
  </div>
</div>

<!-- Cars grid -->
<div class="container py-4">
  <h4 class="section-title mb-4">Available Cars</h4>
  <div class="row g-4" id="carsGrid">
    <div class="col-12 text-center py-5">
      <div class="spinner-border text-primary"></div>
    </div>
  </div>
</div>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-lock-fill me-2"></i>Login</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="loginError" class="alert alert-danger d-none small"></div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="loginUser" class="form-control" placeholder="admin / john"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="loginPass" class="form-control" placeholder="••••••••"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-mg w-100" onclick="doLogin()">Sign In</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
  const RATE_LABELS = { ECONOMY:'50', COMPACT:'80', SUV:'120', LUXURY:'200', VAN:'100' };
  const BADGE_CLASS = { ECONOMY:'badge-economy', COMPACT:'badge-compact', SUV:'badge-suv', LUXURY:'badge-luxury', VAN:'badge-van' };
  let allCars = [];

  updateNavAuth();

  async function init() {
    try {
      const [cars, locations, rates] = await Promise.all([
        API.get('/cars'),
        API.get('/locations'),
        API.get('/rates')
      ]);
      allCars = cars;
      renderRates(rates);
      renderLocationFilter(locations);
      renderCars(cars);
    } catch (e) {
      document.getElementById('carsGrid').innerHTML =
        `<div class="col-12"><div class="alert alert-danger">Could not load cars: ${e.message}</div></div>`;
    }
  }

  function renderRates(rates) {
    const bar = document.getElementById('ratesBar');
    bar.innerHTML = Object.entries(rates).map(([k,v]) =>
      `<span><span class="badge ${BADGE_CLASS[k]} me-1">${k}</span> CHF ${v}/day</span>`
    ).join('');
  }

  function renderLocationFilter(locations) {
    const sel = document.getElementById('filterLocation');
    locations.forEach(l => {
      const o = document.createElement('option');
      o.value = l.id; o.textContent = l.name;
      sel.appendChild(o);
    });
  }

  function filterCars() {
    const cat = document.getElementById('filterCategory').value;
    const loc = document.getElementById('filterLocation').value;
    const filtered = allCars.filter(c =>
      (!cat || c.category === cat) &&
      (!loc || String(c.locationId) === loc || (c.location && String(c.location.id) === loc))
    );
    renderCars(filtered);
  }

  function renderCars(cars) {
    const grid = document.getElementById('carsGrid');
    if (!cars.length) {
      grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><i class="bi bi-car-front display-4 d-block mb-2"></i>No cars found</div>';
      return;
    }
    grid.innerHTML = cars.map(car => `
      <div class="col-12 col-sm-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body text-center">
            <i class="bi bi-car-front-fill car-icon d-block mb-2"></i>
            <h5 class="card-title mb-1">${car.brand} ${car.model}</h5>
            <span class="badge ${BADGE_CLASS[car.category] || 'bg-secondary'} mb-2">${car.category}</span>
            <div class="price-tag mb-1">CHF ${RATE_LABELS[car.category] || '–'}<small class="text-muted fw-normal">/day</small></div>
            <p class="text-muted small mb-3"><i class="bi bi-geo-alt me-1"></i>${car.locationName || 'Switzerland'}</p>
            <a href="/rentals.html?carId=${car.id}" class="btn btn-mg btn-sm w-100">
              <i class="bi bi-calendar-check me-1"></i>Book Now
            </a>
          </div>
        </div>
      </div>`).join('');
  }

  async function doLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('d-none');

    try {
      Auth.save(username, password);
      const users = await API.get('/users');
      const me = users.find(u => u.username === username);
      if (me) sessionStorage.setItem('mg_role', me.role);
      bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      updateNavAuth();
      showToast(`Welcome, ${username}!`);
    } catch (e) {
      Auth.clear();
      errEl.textContent = 'Invalid username or password';
      errEl.classList.remove('d-none');
    }
  }

  document.getElementById('loginPass')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobyGo | Find Your Ride</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">Moby<span>Go</span></div>
        <ul>
            <li><a href="index.html">Fleet</a></li>
            <li><a href="user-bookings.html">My Bookings</a></li>
            <li><a href="admin-dashboard.html">Admin</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Find Your Perfect <span>Ride</span></h1>
        <p>Sustainable, modern mobility across Zurich. Electric, hybrid &amp; city cars — available now.</p>
        <div class="hero-stats">
            <div class="hero-stat">
                <div class="number" id="stat-total">—</div>
                <div class="label">Total Fleet</div>
            </div>
            <div class="hero-stat">
                <div class="number" id="stat-available">—</div>
                <div class="label">Available Now</div>
            </div>
            <div class="hero-stat">
                <div class="number">3</div>
                <div class="label">Stations</div>
            </div>
        </div>
    </section>

    <div class="filter-bar">
        <span class="filter-label">Filter:</span>
        <button class="filter-btn active" data-filter="all">All Cars</button>
        <button class="filter-btn" data-filter="Electric">Electric</button>
        <button class="filter-btn" data-filter="Hybrid">Hybrid</button>
        <button class="filter-btn" data-filter="City">City</button>
    </div>

    <div class="container">
        <div class="section-header">
            <h2>Available Fleet</h2>
            <span class="count-pill" id="car-count">Loading…</span>
        </div>
        <div id="car-grid" class="grid"></div>
    </div>

    <footer>&copy; 2025 <span>MobyGo</span> &mdash; Sustainable Mobility for Zurich</footer>

    <script src="app.js"></script>
</body>
</html>

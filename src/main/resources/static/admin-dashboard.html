<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobyGo Admin | Fleet Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">Moby<span>Go</span></div>
        <ul>
            <li><a href="index.html">View Site</a></li>
            <li><a href="car-form.html">+ Add Car</a></li>
        </ul>
    </nav>

    <div class="page-header">
        <h1>Fleet Management</h1>
        <p>Overview and control of all MobyGo vehicles</p>
    </div>

    <div class="container">
        <div class="stats-grid" id="stats-grid"></div>

        <div class="table-wrap">
            <div class="table-top">
                <h2>All Vehicles</h2>
                <a href="car-form.html" class="btn btn-primary" style="text-decoration:none; padding: 8px 18px; font-size:0.85rem">+ Add Vehicle</a>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>License Plate</th>
                        <th>Model</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Station</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <footer>&copy; 2025 <span>MobyGo</span> &mdash; Admin Panel</footer>

    <script src="app.js"></script>
</body>
</html>

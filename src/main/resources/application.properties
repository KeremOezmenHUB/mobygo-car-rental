spring.application.name=car-rental
# ===============================
# H2 DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:h2:mem:mobygodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable H2 Console so you can view the database in your browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# Automatically create the tables based on your Java Entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# CRITICAL: Tell Spring Boot to create tables FIRST, then run data.sql
spring.jpa.defer-datasource-initialization=true
